spring.application.name=backend
server.port=8080

# PostgreSQL connection. Override these environment variables for non-local deployments.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devconnect}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Allowed WebSocket origins (override via WS_ALLOWED_ORIGINS in production)
app.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173}

# Replace this local development key through JWT_SECRET before deployment.
jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
jwt.expiration=86400000
