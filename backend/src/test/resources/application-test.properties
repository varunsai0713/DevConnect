spring.application.name=backend-test
spring.datasource.url=jdbc:h2:mem:devconnect_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=test-secret-key-that-is-very-long-and-secure-for-hmac-sha-signing-purposes-1234567890
jwt.expiration=86400000

app.websocket.allowed-origins=*

