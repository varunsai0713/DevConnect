spring.application.name=backend
server.port=8080

# PostgreSQL connection. Override these environment variables for non-local deployments.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devconnect}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}password
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Replace this local development key through JWT_SECRET before deployment.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
